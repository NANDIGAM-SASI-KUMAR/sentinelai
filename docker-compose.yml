services:
  mongo:
    image: mongo:7
    platform: linux/amd64
    ports: ["27017:27017"]
    volumes: ["mongodata:/data/db"]

  agents:
    build: ./apps/agents
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
    ports: ["8000:8000"]

  api:
    build: ./apps/api
    environment:
      - MONGO_URI=mongodb://mongo:27017/sentinelai
      - AGENTS_URL=http://agents:8000
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4000
    ports: ["4000:4000"]
    depends_on: [mongo, agents]

  web:
    build: ./apps/web
    environment:
      - VITE_API_URL=http://localhost:4000
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  mongodata:
